<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>動土大典 報到（測試用原型）</title>
<style>
:root{--bg:#f6f3ec;--card:#fffdf8;--ink:#2b2620;--sub:#6b6157;--line:#ddd3c4;--acc:#7a5c2e;--ok:#2f6b3a;--warn:#8a5a00;--bad:#9b2c2c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b18;--card:#272420;--ink:#eee7dc;--sub:#b5aa9b;--line:#3d3830;--acc:#d4b483;--ok:#8fd19e;--warn:#e5b25d;--bad:#f19c9c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:21px;margin:8px 0 2px}
.sub{color:var(--sub);font-size:14px}
.test{background:var(--warn);color:#fff;font-size:13px;padding:4px 10px;border-radius:6px;display:inline-block;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
label{display:block;font-size:15px;margin:10px 0 4px;color:var(--sub)}
input{width:100%;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button{width:100%;min-height:52px;font-size:18px;border:0;border-radius:12px;background:var(--acc);color:#fff;margin-top:14px;cursor:pointer}
button.sec{background:transparent;color:var(--acc);border:1px solid var(--acc)}
button:disabled{opacity:.55}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row b{font-weight:600;text-align:right}
.msg{padding:12px;border-radius:10px;margin:10px 0;font-size:16px}
.msg.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.msg.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.msg.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.big{font-size:22px;font-weight:700}
#qr{display:flex;justify-content:center;margin-top:8px}
#qr svg{width:180px;height:180px;background:#fff;padding:8px;border-radius:8px}
.hide{display:none}
small{color:var(--sub)}
</style>
</head>
<body>
<main>
<span class="test">測試用原型・資料全部是假的</span>
<h1>寶嚴動土大典　報到</h1>
<div class="sub" id="ver">資料版本讀取中…</div>

<div class="card" id="askCard">
  <div>請輸入報名時填的電話（本人或同行家人的電話都可以；手機、市話皆可，有沒有 - 或空白都沒關係）</div>
  <form id="f" autocomplete="off">
    <label>電話</label><input id="p" type="tel" inputmode="tel" autocomplete="off" placeholder="例如 0912-345-678">
    <button id="go" type="submit">查詢</button>
  </form>
  <small>為保護個資，姓名只顯示部分字。掃通知單上的 QR code 可以免輸入。</small>
</div>
<div id="out"></div>
<div id="list"></div>
<div class="card hide" id="bye0"><small>網路不通時，把這一頁（含 QR）給工作人員看，就能人工報到。</small>
  <button class="sec" id="bye" type="button">查完了，清除這一頁</button></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="phone_norm.js"></script>
<script>
/* ===== 設定（原型）===== */
var CFG={ ITER:150000, SALT:'baoyan-dongtu-2026-checkin-v2',
  FORM:'https://docs.google.com/forms/d/e/1FAIpQLScapq4Lx8Ji4TTCdrV6a0tocjQiZtMjoeh856DF2Dj5vS_ahA/formResponse',
  ENTRY:'entry.1225980314', EMAIL:'test@example.com',   /* 測試表單還在收 email 才需要；正式表單設成「不收集」後拿掉 */
  STAGE:function(){ var d=new Date(); return (d.getMonth()===11&&d.getDate()>=26)?'上車':'入住'; } };
var $=function(i){return document.getElementById(i)}, te=new TextEncoder(), RECS=[];
function msg(t,c){ $('out').innerHTML=t?'<div class="msg '+(c||'warn')+'">'+t+'</div>':''; }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function b64u(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)}); }
async function derive(k){
  var km=await crypto.subtle.importKey('raw',te.encode(k),'PBKDF2',false,['deriveBits']);
  var bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:te.encode(CFG.SALT),iterations:CFG.ITER},km,512));
  return {id:Array.from(bits.slice(0,16)).map(function(x){return x.toString(16).padStart(2,'0')}).join(''), kek:bits.slice(16,48)};
}
async function open_(keyBytes,blob){ var raw=b64u(blob), k=await crypto.subtle.importKey('raw',keyBytes,'AES-GCM',false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},k,raw.slice(12)))); }
/* 抓檔：不吃快取、失敗退避重試三次；畫面永遠有字 */
async function getFile(path){ var last='';
  for(var k=0;k<4;k++){ try{ var ac=new AbortController(), to=setTimeout(function(){ac.abort()},8000);
      var r=await fetch(path+'?t='+Date.now(),{cache:'no-store',signal:ac.signal}); clearTimeout(to);
      if(r.status===404) return null; if(r.ok) return await r.json(); last='伺服器回 '+r.status;
    }catch(e){ last=(e.name==='AbortError')?'等太久':'網路不通'; }
    msg('連線不順（'+last+'），第 '+(k+1)+' 次重試中…','warn'); await new Promise(function(r){setTimeout(r,800*(k+1))}); }
  throw new Error(last||'連不上'); }
function render(){
  var st=CFG.STAGE(), q=pend(), h='';
  if(RECS.length>1) h+='<div class="msg ok">這支電話共有 '+RECS.length+' 筆報名，全部列在下面</div>';
  RECS.forEach(function(r,i){
    var rows=[['所屬分院',r.br],['同行者',r.mt],['飯店',r.ho],['房號',r.rm],['車次',r.bus],['小組',r.gp],['組長',r.ld]], loc=q[r.rid+'|'+st];
    h+='<div class="card">'+(RECS.length>1?'<small>第 '+(i+1)+' 筆</small>':'')+'<div class="big">'+esc(r.n)+'</div>'+
      rows.map(function(x){return '<div class="row"><span>'+x[0]+'</span><b>'+esc(x[1]||'—')+'</b></div>'}).join('');
    if(r.ci) h+='<div class="msg ok">✓ 已完成報到（'+esc(r.ci)+'）</div>';
    else if(loc&&loc.sent) h+='<div class="msg ok">✓ 已收到'+st+'報到（'+esc(loc.hm)+' 送出）<br><small>工作人員端約 1 分鐘內會顯示'+(loc.ms?'；送出耗時 '+loc.ms+' 秒':'')+'</small></div>';
    else if(loc) h+='<div class="msg warn">訊號不好，報到已暫存在這支手機，恢復連線會自動送出。也可以把這頁給工作人員看。</div>';
    else h+='<button type="button" data-i="'+i+'" class="ckb">我已到達，'+st+'報到</button>';
    h+='<div class="qr" id="qr'+i+'"></div></div>';
  });
  $('list').innerHTML=h; $('bye0').classList.toggle('hide',!RECS.length);
  RECS.forEach(function(r,i){ try{ var qq=qrcode(0,'M'); qq.addData('BY|'+r.k+'|'+r.n); qq.make(); $('qr'+i).innerHTML=qq.createSvgTag({scalable:true}); }catch(e){ $('qr'+i).textContent='報到碼：'+r.k; } });
  Array.prototype.forEach.call(document.querySelectorAll('.ckb'),function(b){ b.onclick=function(){ checkin(RECS[+b.dataset.i]); }; });
}
/* 待送報到：只存「報名代碼＋階段＋時間＋憑證」，不存電話（共用手機不留聯絡資料） */
function pend(){ try{return JSON.parse(localStorage.getItem('ckq')||'{}')}catch(e){return {}} }
function savePend(o){ try{localStorage.setItem('ckq',JSON.stringify(o))}catch(e){} }
async function send(item){ var body=new URLSearchParams(); body.set(CFG.ENTRY,[item.rid,item.tk,item.st,item.n,item.at].join('|')); if(CFG.EMAIL) body.set('emailAddress',CFG.EMAIL);
  var ac=new AbortController(), to=setTimeout(function(){ac.abort()},10000);
  await fetch(CFG.FORM,{method:'POST',mode:'no-cors',body:body,signal:ac.signal}); clearTimeout(to); }   /* no-cors：送得出去就算收到 */
async function checkin(r){
  var st=CFG.STAGE(), now=new Date(), hm=('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2);
  var item={rid:r.rid,tk:r.tk,st:st,n:1,at:now.toISOString(),hm:hm,sent:true}, q=pend(); q[r.rid+'|'+st]=item; savePend(q); render();   /* 樂觀：0 秒 */
  var t0=performance.now();
  try{ await send(item); item.ms=((performance.now()-t0)/1000).toFixed(1); }catch(e){ item.sent=false; }
  q=pend(); q[r.rid+'|'+st]=item; savePend(q); render(); }
setInterval(async function(){ var q=pend(), ch=false; for(var k in q){ if(q[k].sent) continue; try{ await send(q[k]); q[k].sent=true; ch=true; }catch(e){} } if(ch){ savePend(q); if(RECS.length) render(); } },5000);
$('f').onsubmit=async function(e){ e.preventDefault();
  var keys=phoneQueryKeys_($('p').value);
  if(!keys.length){ msg('請輸入完整的電話號碼（手機 10 碼，或市話含區碼）','warn'); return; }
  $('go').disabled=true; msg('查詢中…','warn'); var t0=performance.now();
  try{ var got=null;
    for(var i=0;i<keys.length&&!got;i++){ var d=await derive(keys[i]); var f=await getFile('d/'+d.id+'.json'); if(f) got=await open_(d.kek,f.c); }   /* 完整號碼 → 末 9 碼 → 補 0，第一個有的就用 */
    if(!got){ msg('查不到這支電話的報名資料。請確認是報名時填的電話（本人或同行家人皆可），或洽門口工作人員。','bad'); return; }
    $('p').value=''; RECS=got; msg(''); render(); $('ver').textContent=$('ver').textContent.split('｜')[0]+'｜ 本次查詢 '+((performance.now()-t0)/1000).toFixed(1)+' 秒';
  }catch(err){ msg('目前查不到（'+esc(err.message)+'）。請稍後再按一次，或直接洽門口工作人員。','bad'); }
  finally{ $('go').disabled=false; } };
$('bye').onclick=function(){ RECS=[]; history.replaceState(null,'',location.pathname); $('list').innerHTML=''; $('bye0').classList.add('hide'); msg(''); };
(async function(){
  try{ var v=await getFile('v.json'); $('ver').textContent='資料更新：'+new Date(v.at).toLocaleString('zh-TW',{hour12:false}); }catch(e){ $('ver').textContent='暫時讀不到版本（不影響查詢）'; }
  var m=location.hash.match(/k=([0-9a-f]{32})\.([A-Za-z0-9_-]+)/);
  if(m){ msg('讀取中…','warn'); try{ var f=await getFile('r/'+m[1]+'.json'); if(!f){ msg('這個 QR 已失效，請改輸入電話查詢。','bad'); return; } RECS=[await open_(b64u(m[2]),f.c)]; msg(''); render(); }catch(e){ msg('讀不到資料（'+esc(e.message)+'），請稍後再試或洽工作人員。','bad'); } }
})();
</script>
</body>
</html>
